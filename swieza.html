<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Strefa Świeża & Lada | Better Biedronka</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary-red: #da291c; --primary-gold: #d4af37; --bg-color: #050505; --card-bg: rgba(20, 20, 20, 0.7); --text-main: #f8f8f8; }
        body { background-color: var(--bg-color); color: var(--text-main); font-family: 'Inter', sans-serif; padding: 20px; }
        .nav-link { color: var(--primary-gold); text-decoration: none; display: inline-block; margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; max-width: 1100px; margin: 0 auto; }
        .card { background: var(--card-bg); padding: 30px; border-radius: 16px; border: 1px solid #333; text-decoration: none; color: white; transition: 0.3s; }
        .card:hover { border-color: var(--primary-gold); transform: translateY(-5px); }
        .icon { font-size: 2rem; color: var(--primary-red); margin-bottom: 15px; }
    </style>
</head>
<body>
    <a href="index.html" class="nav-link"><i class="fa-solid fa-arrow-left"></i> Powrót do Panelu Głównego</a>
    <div class="grid">
        <a href="manual_lada.pdf" target="_blank" class="card">
            <div class="icon"><i class="fa-solid fa-utensils"></i></div>
            <h3>Manual Lada Tradycyjna</h3>
            <p>Standardy obsługi stoiska mięsno-wędliniarskiego.</p>
        </a>
        <a href="manual_som.pdf" target="_blank" class="card">
            <div class="icon"><i class="fa-solid fa-temperature-full"></i></div>
            <h3>Manual dla SOM</h3>
            <p>Wytyczne dotyczące obsługi świeżych produktów.</p>
        </a>
    </div>
</body>
</html>
