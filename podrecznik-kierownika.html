<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Podręcznik Kierownika | Better Biedronka</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-red: #da291c;
            --primary-gold: #d4af37;
            --bg-color: #0a0a0a;
            --card-bg: #141414;
            --text-main: #f0f0f0;
            --border-color: #2a2a2a;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* Pasek nawigacji czytnika */
        .reader-nav {
            background-color: var(--card-bg);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }
        .back-btn {
            color: var(--text-main);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            transition: color 0.3s;
        }
        .back-btn:hover { color: var(--primary-gold); }
        .reader-title { color: var(--primary-gold); font-weight: 600; }
        
        /* Obszar wyświetlania PDF */
        .pdf-container {
            flex-grow: 1;
            width: 100%;
            height: calc(100vh - 60px);
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="reader-nav">
        <a href="index.html" class="back-btn">
            <i class="fa-solid fa-arrow-left"></i> Wróć do Bazy Wiedzy
        </a>
        <div class="reader-title"><i class="fa-solid fa-file-pdf"></i> Podręcznik Kierownika Sklepu</div>
    </div>

    <div class="pdf-container">
        <iframe src="podrecznik_kierownika.pdf" title="Podręcznik Kierownika"></iframe>
    </div>

</body>
</html>
